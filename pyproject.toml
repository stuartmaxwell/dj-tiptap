[project]
name = "dj-tiptap"
version = "0.1.0"
description = "Rich text editor for Django based on Tiptap."
authors = [
    {name = "Stuart Maxwell", email = "stuart@amanzi.nz"},
]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}
dependencies = ["django~=6.0"]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "playwright~=1.61",
    "pytest-django~=4.12",
    "pillow~=12.3",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
pythonpath = ". example"
DJANGO_SETTINGS_MODULE = "config.settings_testing"
python_files = "tests.py test_*.py *_tests.py"

[tool.djangofmt]
line-length = 240
indent-width = 2
profile = "django"
html-void-self-closing = "never"
preserve-unquoted-attrs = false
